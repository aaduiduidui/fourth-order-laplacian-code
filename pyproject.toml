[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fourth-order-laplacian-code"
version = "0.1.0"
description = "Exact-arithmetic verification for fourth-order finite-difference Laplacians"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "sympy==1.14.0",
    "matplotlib==3.10.8",
    "gmpy2==2.2.2",
]

[tool.setuptools]
py-modules = [
    "verify_bh_charpoly",
    "verify_onesided_charpoly",
    "verify_onesided_root_counts",
    "sweep_nonreal_eigs",
]
